<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>EInkBot - Aviso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-content">
        <div class="cards-container">
            <a href="https://aviso.bz/login" class="card">SIGN IN {% if aviso_done %}✔{% endif %}</a>
            <!-- <a href="https://m.youtube.com/feed/library?hl=en" class="card">YouTube {% if yt_done %}✔{% endif %}</a> -->
        </div>
        <div id="authMessage" class="auth-message" style="display:none">⚠️ Please log in to aviso.bz</div>
        <!-- <div id="ytAuthMessage" class="auth-message" style="display:none">⚠️ Stop the bot, please log in to YouTube to complete YouTube tasks if you want. Then start the bot.</div> -->
        {% if not libs_installed %}
        <div class="card" id="installCard" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;">
            <div style="font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none;margin-bottom:14px;opacity:0.9;">
                System reinstallation to resolve operational issues
            </div>
            <button id="btnInstall" class="bot-btn" onclick="installDeps()">Install</button>
            <div id="installProgressWrap" style="display:none;margin-top:12px;">
                <div style="width:100%;height:10px;background:rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;">
                    <div id="installProgressBar" style="width:0%;height:100%;background:#00ff44;transition:width 0.3s ease;"></div>
                </div>
                <div id="installProgressText" style="font-size:0.8rem;margin-top:6px;opacity:0.85;">Starting...</div>
            </div>
        </div>
        <script>
        (function(){
            var btnInstall = document.getElementById('btnInstall');
            var wrap = document.getElementById('installProgressWrap');
            var bar = document.getElementById('installProgressBar');
            var txt = document.getElementById('installProgressText');
            var started = false;
            window.installDeps = function(){
                if(btnInstall.disabled) return;
                btnInstall.disabled = true;
                fetch("/install_deps?token={{ token }}", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({service:"aviso"})})
                .then(function(r){return r.json()}).then(function(d){
                    if(d.status === "already_installed"){
                        location.reload();
                        return;
                    }
                    wrap.style.display = 'block';
                    if(!started){
                        started = true;
                        setInterval(function(){
                            fetch("/stream_status?token={{ token }}&page=1").then(function(r){return r.json()}).then(function(d){
                                if(d.installing_libs){
                                    bar.style.width = (d.install_progress || 0) + '%';
                                    txt.textContent = (d.install_progress || 0) + '%';
                                } else {
                                    location.reload();
                                }
                            }).catch(function(){});
                        }, 2000);
                    }
                }).catch(function(){
                    btnInstall.disabled = false;
                });
            };
        })();
        </script>
        {% endif %}
        {% if aviso_done %}
        <div class="stream-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Offline</span>
        </div>
        <div class="bot-controls" id="botControls">
            <button id="btnStart" class="bot-btn" onclick="botStart()" {% if bot_started %}disabled{% endif %}>Start</button>
            <button id="btnStop" class="bot-btn" onclick="botStop()" {% if not bot_started %}disabled{% endif %}>Stop</button>
        </div>
        <div class="screenshot-container">
            <img id="streamView" class="stream-view" style="display:none" alt="Live browser stream">
        </div>
        <script>
        (function(){
            var statusDot = document.getElementById('statusDot');
            var statusText = document.getElementById('statusText');
            var authMsg = document.getElementById('authMessage');
            // var ytAuthMsg = document.getElementById('ytAuthMessage');
            setInterval(function(){
                fetch("/stream_status?token={{ token }}&page=1").then(function(r){return r.json()}).then(function(d){
                    if(!d.aviso_valid){
                        authMsg.style.display = 'block';
                        // ytAuthMsg.style.display = 'none';
                        statusDot.className = 'status-dot offline';
                        statusText.textContent = 'Offline';
                        document.getElementById('streamView').style.display = 'none';
                        document.getElementById('botControls').style.display = 'none';
                        return;
                    }
                    authMsg.style.display = 'none';
                    // ytAuthMsg.style.display = d.yt_valid ? 'none' : 'block';
                    if(d.active){
                        statusDot.className = 'status-dot live';
                        statusText.textContent = 'Live';
                        document.getElementById('streamView').src='/video_feed?token={{ token }}';
                        document.getElementById('streamView').style.display='block';
                    } else if(d.bot_running){
                        statusDot.className = 'status-dot connecting';
                        statusText.textContent = 'Connecting...';
                        document.getElementById('streamView').style.display = 'none';
                    } else {
                        statusDot.className = 'status-dot offline';
                        statusText.textContent = 'Offline';
                        document.getElementById('streamView').style.display = 'none';
                    }
                    document.getElementById('btnStart').disabled = d.bot_running;
                    document.getElementById('btnStop').disabled = !d.bot_running;
                }).catch(function(){});
            }, 2000);
        })();
        </script>
        {% endif %}
    </div>
    <div class="version">v{{ version }}</div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
    function botStart() {
        fetch("/bot/start?token={{ token }}", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user_agent: navigator.userAgent})})
        .then(r=>r.json()).then(()=>location.reload());
    }
    function botStop() {
        fetch("/bot/stop?token={{ token }}", {method:"POST"})
        .then(r=>r.json()).then(()=>location.reload());
    }
    </script>
    <script src="{{ url_for('static', filename='ad_check.js') }}"></script>
</body>
</html>
